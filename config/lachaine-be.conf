# 后端 Java 项目部署配置文件
# 所有变量必须定义，否则脚本会报错

# 项目名称（用于日志显示）
PROJECT_NAME="LaChaine Backend"

# Git 仓库的项目目录
PROJECT_DIR="/home/azureuser/dev/gits/github/lachaine-be"

# Git 分支名
BRANCH="release"

# Maven 编译生成的 JAR 文件名
JAR_NAME="hk.com.lachaine.process.jar"

# 部署目录（存放 JAR 文件和启停脚本的目录）
DEPLOY_DIR="/project"

# 停止服务脚本名称（应该在 DEPLOY_DIR 中）
STOP_SCRIPT="stop-lachaine-docker.sh"

# 启动服务脚本名称（应该在 DEPLOY_DIR 中）
START_SCRIPT="start-lachaine-docker.sh"

# ===== 可选配置 =====
# 是否跳过单元测试：true/false （默认: true）
SKIP_TESTS="true"

# mvn 命令路径（默认: mvn）
# MVN_PATH="/usr/local/maven/bin/mvn"
MVN_PATH="/usr/bin/mvn"

# 是否启用远程部署：true/false （默认: false）
# REMOTE_ENABLED="false"

# 远程服务器配置（REMOTE_ENABLED=true 时使用）
# REMOTE_HOST="www.xuxiaoye.com"
# REMOTE_USER="root"
# REMOTE_DEPLOY_DIR="/project"

# 日志文件路径（默认: /tmp/deploy-be-<config-name>.log）
# LOG_FILE="/tmp/custom-deploy-be.log"