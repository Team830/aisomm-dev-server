# 前端项目部署配置文件
# 所有变量必须定义，否则脚本会报错

# 项目名称（用于日志显示）
PROJECT_NAME="LaChaine Admin Frontend"

# Git 仓库的项目目录
PROJECT_DIR="/home/azureuser/dev/gits/github/lachaine-admin-fe"

# Git 分支名
BRANCH="release"

# npm 可执行文件的完整路径
NPM_PATH="/usr/bin/npm"

# npm 构建命令
BUILD_CMD="build:prd:nomap"

# npm 构建输出目录名称
SOURCE_DIR="dist"

# 部署目录（Web 服务器根目录）
DEPLOY_DIR="/var/www/html"

# 编译产物目录名称（构建输出到的目录）
DEPLOY_DIR_NAME="dist-lachaine-admin"

# nginx 实际服务目录名称（编译产物会被移动到此目录）
WEB_NAME="lachaine-admin"

# 资源目录（部署后恢复该目录的内容，如用户上传的文件）
RESOURCE_DIR="$DEPLOY_DIR/$WEB_NAME/resources"

# ===== 可选配置 =====
# 是否启用远程部署：true/false （默认: false）
# REMOTE_ENABLED="false"

# 远程服务器配置（REMOTE_ENABLED=true 时使用）
# REMOTE_HOST="www.xuxiaoye.com"
# REMOTE_USER="root"

# 日志文件路径（默认: /tmp/deploy-logs/fe-<config-name>.log）
# LOG_FILE="/tmp/custom-deploy-fe.log"